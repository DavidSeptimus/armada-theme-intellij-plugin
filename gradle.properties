# Shared by every plugin under plugins/. Each plugin's own gradle.properties sets its
# pluginGroup / pluginName / pluginVersion / pluginRepositoryUrl.

# Supported build number ranges -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 253

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
platformType = IU
platformVersion = 2025.3.3

# Run-only IDE slots for the Pro sandboxes (runIdeFloor / runIdeCurrent / runIdeLatestEap).
# Plugins always build against platformVersion (the floor); only the launched IDE changes.
# Current = the newest shipped release; Eap = the newest public build of the next line.
# Bump both as JetBrains ships (`./gradlew printProductsReleases` lists candidates), then run
# `./gradlew pruneIdeCache` to drop the superseded downloads.
platformVersionCurrent = 2026.2.3
platformVersionEap = 263.5153.40

# Marketplace plugins installed in the Pro sandboxes: language plugins for sample-file highlighting,
# and InfiniTint to check that the themes tint consistently. Each sandbox resolves the newest build
# compatible with its own IDE.
sandboxPlugins = Dart,org.jetbrains.plugins.go,DevKit,PsiViewer,com.falsepattern.zigbrains,com.redhat.devtools.lsp4ij,PythonCore,Pythonid,com.jetbrains.php,com.jetbrains.sh,com.jetbrains.rust,dev.tachilabs.infinitint

# Paletteer checkout whose local build (build/distributions) the Pro sandboxes install when present.
paletteerProjectDir = ../paletteer-intellij-plugin

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.8.0

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs=-XX\:MaxHeapSize\=2048m -Xmx2048m
