# Shared by every plugin under plugins/. Each plugin's own gradle.properties sets its
# pluginGroup / pluginName / pluginVersion / pluginRepositoryUrl.

# Supported build number ranges -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 253

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
platformType = IU
platformVersion = 2025.3.3

# Run-only IDE slots for the Pro sandboxes (runIdeFloor / runIdeCurrent / runIdeLatestEap).
# Plugins always build against platformVersion (the floor); only the launched IDE changes.
# Current = the newest shipped release; Eap = the newest public build of the next line.
# Bump both as JetBrains ships (`./gradlew printProductsReleases` lists candidates), then run
# `./gradlew pruneIdeCache` to drop the superseded downloads.
platformVersionCurrent = 2026.3
platformVersionEap = 263.5153.40

# The newest release of each supported branch. harvestUiKeys builds the UI key catalog from them, and
# the oldest is the base the UI theme review treats as already known.
uiCatalogVersions = 2025.3.6.2, 2026.1.5.1, 2026.2.4, 2026.3

# Marketplace plugins installed in the Pro sandboxes. Each sandbox resolves the newest build
# compatible with its own IDE.
# Every language the schemes or the syntax highlighter support, so sample files highlight and the
# scheme coverage report sees each language's keys. A language added to a scheme belongs here too.
# LSP4IJ is ZigBrains' dependency. C/C++ comes from com.intellij.clion. C# (ReSharper.* keys) only
# exists in Rider, so those keys can't be checked in an IU sandbox.
sandboxLanguagePlugins = Dart,org.jetbrains.plugins.go,com.falsepattern.zigbrains,com.redhat.devtools.lsp4ij,PythonCore,Pythonid,com.jetbrains.php,com.jetbrains.sh,com.jetbrains.rust,com.perl5,org.jetbrains.plugins.ruby,com.tang,dev.meanmail.plugin.nginx-intellij-plugin,com.intellij.plugin.adernov.powershell,R4Intellij,com.intellij.clion
# Language plugins with no Marketplace build for the 263 line yet. Skipped on runIdeCurrent,
# runIdeLatestEap and schemeCoverageReport, where the report lists them as missing, because a plugin
# with no compatible build fails the whole sandbox. Remove each one once it ships for 263.
sandboxPluginsWithoutNewestBuild = com.tang,com.jetbrains.rust
# The supported languages that IU bundles. Not installed by us; the coverage report checks they're present.
sandboxBundledLanguagePlugins = com.intellij.java,org.jetbrains.kotlin,org.intellij.groovy,JavaScript,com.intellij.css,org.jetbrains.plugins.sass,org.jetbrains.plugins.less,org.intellij.plugins.markdown,org.toml.lang,org.jetbrains.plugins.yaml,com.intellij.database,com.intellij.properties,Docker,org.jetbrains.plugins.textmate
# Development tools, and InfiniTint to check that the themes tint consistently.
sandboxPlugins = DevKit,PsiViewer,dev.tachilabs.infinitint

# Paletteer checkout whose local build (build/distributions) the Pro sandboxes install when present.
paletteerProjectDir = ../paletteer-intellij-plugin

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.8.0

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs=-XX\:MaxHeapSize\=2048m -Xmx2048m
